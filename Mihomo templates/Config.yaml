rules:
  # DNS HIJACK, на случай если будет отключен TUN
  - DST-PORT,53,DNS-OUT
  - DOMAIN-SUFFIX,invalid,REJECT
  # 1. === LOCAL & PRIVATE (Top Priority) ===
  - RULE-SET,geosite-private,DIRECT,no-resolve
  - RULE-SET,geoip-private,DIRECT
  - RULE-SET,apps-direct,DIRECT
  - RULE-SET,torrent-clients,DIRECT
  - RULE-SET,torrent-trackers,DIRECT
  - PROCESS-NAME-REGEX,(?i).*torrent.*,DIRECT
  - RULE-SET,remote-control,DIRECT

  # 2. === APPLE SERVICES (Critical for iOS in RU) ===
  - RULE-SET,apple,DIRECT
  - DOMAIN-SUFFIX,push.apple.com,DIRECT
  - DOMAIN-SUFFIX,apns.net,DIRECT

  # Сервисы которые нужно пускать в DIRECT
