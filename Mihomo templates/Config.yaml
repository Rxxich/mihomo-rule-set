dns:
  enable: true
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  ipv6: false #true - если хотите резолвить в ipv6
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - rule-set:geosite-private
    - "*+.lan"
    - "+.local"
    - "*.msftncsi.com"
    - "stun.*.*.*"
    - "stun.*.*"
    - "time.windows.com"
    - "time.nist.gov"
    - "time.apple.com"
    - "*.openwrt.pool.ntp.org"
    - "pool.ntp.org"
    - "ntp.ubuntu.com"
    - "time1.apple.com"
    - "time2.apple.com"
    - "time3.apple.com"
    - "time4.apple.com"
    - "time5.apple.com"
    - "time6.apple.com"
    - "time7.apple.com"
    - "time1.google.com"
    - "time2.google.com"
    - "time3.google.com"
    - "time4.google.com"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "+.xboxlive.com"
    - "*.*.stun.playstation.net"
    - "xbox.*.*.microsoft.com"
    - "*.ipv6.microsoft.com"
    - "speedtest.cros.wr.pvp.net"
  # ----
  # Опционально выбираем DNS сервера - меняйте на ваш вкус.
  default-nameserver: *dns_ru
  proxy-server-nameserver: *dns_ru
  direct-nameserver: *dns_ru
  nameserver:
    - https://cloudflare-dns.com/dns-query
  nameserver-policy:
    rule-set:geosite-private:
      - system
    "rule-set:apps-proxy,ru-bundle,refilter_domains,speedtest-net,domain-proxy,youtube,discord_domains,telegram-domains,additional-telegram-domains,whatsapp,ai-app,ai-bundle,gemini,google-deepmind,openai,notion,rezka-riga,github-domain": *dns_proxy

proxies:
  - name: "📴 Выкл"
    type: direct
    udp: true
  - name: DNS-OUT
    type: dns

