x-anchors:
  reserved_ips: &reserved_ips
    - 0.0.0.0/8
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 192.168.0.0/16
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 224.0.0.0/3
    - ::/127
    - fc00::/7
    - fe80::/10
    - ff00::/8

  dns_ru: &dns_ru
    - https://77.88.8.8/dns-query

  dns_proxy: &dns_proxy
    - https://8.8.8.8/dns-query#♻️ Авто VPN
    - https://194.242.2.2/dns-query#♻️ Авто VPN

  pr_http: &pr_http
    type: http
    interval: 86400

  rp_classical: &rp_classical
    <<: *pr_http
    behavior: classical
    format: yaml
    proxy: ♻️ Авто VPN

  rp_domain: &rp_domain
    <<: *pr_http
    behavior: domain
    format: mrs
    proxy: ♻️ Авто VPN

  rp_ipcidr: &rp_ipcidr
    <<: *pr_http
    behavior: ipcidr
    format: mrs
    proxy: ♻️ Авто VPN

mixed-port: 10808
allow-lan: true
bind-address: "*"
lan-allowed-ips: *reserved_ips
tcp-concurrent: true
enable-process: true
find-process-mode: always
mode: rule
log-level: info
ipv6: false
keep-alive-interval: 30
unified-delay: true

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
  skip-dst-address: *reserved_ips

tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true
  route-exclude-address: *reserved_ips
