  # Ловит любой процесс с Win64-Shipping в имени. Покрывает: VALORANT, Fortnite,
  # Palworld, Marvel Rivals, TEKKEN 8, Satisfactory, MultiVersus, Ready or Not,
  # Grounded, Deep Rock Galactic, Back 4 Blood, Jedi и др. на Unreal Engine.
  - PROCESS-NAME-REGEX,(?i)win64-shipping